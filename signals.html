<!DOCTYPE html>
<html>
<head>
  <title>Signals</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body{
      background:#07132b;
      color:white;
      font-family:Arial;
      padding:20px;
    }
    .card{
      background:#0d1b3d;
      padding:20px;
      border-radius:16px;
      margin-top:20px;
    }
    .buy{color:#00ff66;font-weight:bold;}
    .sell{color:#ff4444;font-weight:bold;}
  </style>
</head>
<body>
  <h1>Live Signals</h1>

  <div class="card">
    <h2>EUR/USD</h2>
    <p>Signal: <span class="buy">BUY</span></p>
    <p>Entry: 1.1720</p>
    <p>Target: 1.1760</p>
  </div>

  <div class="card">
    <h2>GBP/USD</h2>
    <p>Signal: <span class="sell">SELL</span></p>
    <p>Entry: 1.3560</p>
    <p>Target: 1.3500</p>
  </div>
</body>
</html>
