<!DOCTYPE html>
<html>
<head>
<meta charset='UTF-8'>
<meta name='viewport' content='width=device-width,initial-scale=1'>
<title>Live Forex Signals</title>
<style>
body{font-family:Arial;background:#0f172a;color:#fff;margin:0;padding:20px}
h1{text-align:center}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:15px}
.card{background:#111827;border-radius:12px;padding:15px}
.buy{color:#22c55e;font-weight:bold}
.sell{color:#ef4444;font-weight:bold}
.wait{color:#f59e0b;font-weight:bold}
.price{font-size:24px;margin:8px 0}
.small{font-size:12px;color:#94a3b8}
</style>
</head>
<body>

<h1>LIVE FOREX SIGNALS</h1>
<div class='grid' id='signals'></div>

<script>
const API_KEY = '0e0e9b5a995544eab90cf5e28c8344d3';

const pairs = [
  'EUR/USD',
  'GBP/USD',
  'USD/JPY',
  'AUD/USD',
  'USD/CHF',
  'USD/CAD',
  'NZD/USD',
  'EUR/JPY'
];

async function getSignal(pair){
  const url = `https://api.twelvedata.com/time_series?symbol=${pair}&interval=1min&outputsize=20&apikey=${API_KEY}`;

  try{
    const res = await fetch(url);
    const data = await res.json();

    if(!data.values) return null;

    const values = data.values.map(v=>parseFloat(v.close)).reverse();
    const current = values[values.length-1];
    const previous = values[values.length-2];

    let signal='WAIT', cls='wait';

    if(current > previous){
      signal='BUY';
      cls='buy';
    }else if(current < previous){
      signal='SELL';
      cls='sell';
    }

    return {
      pair,
      price: current.toFixed(5),
      signal,
      cls,
      time: new Date().toLocaleTimeString()
    };

  }catch(e){
    return null;
  }
}

async function loadSignals(){
  const box = document.getElementById('signals');
  box.innerHTML = 'Loading live signals...';

  const results = await Promise.all(pairs.map(getSignal));

  box.innerHTML = '';

  results.forEach(r=>{
    if(!r) return;

    box.innerHTML += `
      <div class='card'>
        <h3>${r.pair}</h3>
        <div class='price'>${r.price}</div>
        <div class='${r.cls}'>${r.signal}</div>
        <div class='small'>Updated: ${r.time}</div>
      </div>
    `;
  });
}

loadSignals();
setInterval(loadSignals, 15000);
</script>

</body>
</html>
