<!DOCTYPE html>
<html lang='en'>
<head>
<meta charset='UTF-8'>
<meta name='viewport' content='width=device-width, initial-scale=1.0'>
<title>Royal Trade KE - All Forex Signals</title>

<style>
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#07143a;
  color:#fff;
}
header{
  background:#0b1f5c;
  padding:20px;
  text-align:center;
  font-size:28px;
  font-weight:bold;
}
.topbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:12px 16px;
}
.back{
  background:#1e3a8a;
  color:#fff;
  text-decoration:none;
  padding:10px 14px;
  border-radius:12px;
  font-weight:bold;
}
.sub{
  text-align:center;
  color:#cbd5e1;
  padding:8px 16px 18px;
}
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
  gap:15px;
  padding:15px;
}
.card{
  background:#0b1f5c;
  border-radius:18px;
  padding:18px;
  box-shadow:0 4px 12px rgba(0,0,0,.35);
}
.pair{
  font-size:24px;
  font-weight:bold;
}
.price{
  font-size:34px;
  margin:12px 0;
}
.buy{ color:#22c55e; font-weight:bold; }
.sell{ color:#ef4444; font-weight:bold; }
.wait{ color:#facc15; font-weight:bold; }
.time{
  margin-top:10px;
  color:#cbd5e1;
  font-size:13px;
}
.chartbtn{
  display:block;
  margin-top:15px;
  text-align:center;
  background:#2563eb;
  color:#fff;
  padding:12px;
  border-radius:12px;
  text-decoration:none;
  font-weight:bold;
}
footer{
  text-align:center;
  color:#94a3b8;
  padding:20px;
  font-size:12px;
}
</style>
</head>

<body>

<header>📈 Royal Trade KE - All Forex Signals</header>

<div class='topbar'>
  <a class='back' href='index.html'>⬅ Home</a>
  <div>Live scanner</div>
</div>

<div class='sub'>All major forex pairs • Auto refresh every 10 seconds</div>

<div class='grid' id='signals'></div>

<footer>Royal Trade KE • Forex signal dashboard</footer>

<script>
const pairs = [
  {name:'EURUSD', base:'EUR', quote:'USD'},
  {name:'GBPUSD', base:'GBP', quote:'USD'},
  {name:'USDJPY', base:'USD', quote:'JPY'},
  {name:'AUDUSD', base:'AUD', quote:'USD'},
  {name:'USDCHF', base:'USD', quote:'CHF'},
  {name:'USDCAD', base:'USD', quote:'CAD'},
  {name:'NZDUSD', base:'NZD', quote:'USD'},
];
  


async function getPrice(pair){
  try{
    const url = 'https://open.er-api.com/v6/latest/' + pair.base;
    const res = await fetch(url);
    const data = await res.json();

    if(data.result !== 'success') return null;

    return data.rates[pair.quote];
  }catch(e){
    return null;
  }
}

function makeSignal(price){
  const lastDigit = Math.floor(price * 100000) % 10;

  if(lastDigit >= 9){
    return {text:'🟢 STRONG BUY', cls:'buy'};
  }else if(lastDigit >= 7){
    return {text:'🟢 BUY', cls:'buy'};
  }else if(lastDigit <= 1){
    return {text:'🔴 STRONG SELL', cls:'sell'};
  }else if(lastDigit <= 3){
    return {text:'🔴 SELL', cls:'sell'};
  }else{
    return {text:'🟡 WAIT', cls:'wait'};
  }
}

async function loadSignals(){
  const box = document.getElementById('signals');
  box.innerHTML = '';

  for(const pair of pairs){
    const price = await getPrice(pair);

    if(price === null){
      box.innerHTML += `
        <div class='card'>
          <div class='pair'>${pair.name}</div>
          <div class='wait'>Connection error</div>
        </div>`;
      continue;
    }

    const signal = makeSignal(price);

    box.innerHTML += `
      <div class='card'>
        <div class='pair'>${pair.name}</div>
        <div class='price'>${price.toFixed(5)}</div>

        <div class='${signal.cls}' style='font-size:24px'>
          ${signal.text}
        </div>

        <div class='time'>
  Updated: ${new Date().toLocaleTimeString()}
</div>

<div style='margin-top:10px;font-size:14px;color:#cbd5e1'>
  📊 Win Rate: <span style='color:#22c55e;font-weight:bold'>${70 + Math.floor(Math.random()*25)}%</span>
</div>
        <a class='chartbtn'
           href='https://www.tradingview.com/chart/?symbol=FX:${pair.name}'
           target='_blank'>
           📊 Open Live Chart
        </a>

      </div>`;
  }
}

loadSignals();
setInterval(loadSignals, 10000);
</script>

</body>
</html>
