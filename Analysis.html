<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AI Market Analysis</title>
<style>
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#0f172a;
  color:white;
}
header{
  background:#111827;
  padding:15px;
  text-align:center;
  font-size:24px;
  font-weight:bold;
}
.container{
  padding:15px;
}
.card{
  background:#1e293b;
  border-radius:15px;
  padding:15px;
  margin-bottom:15px;
  box-shadow:0 0 10px rgba(0,0,0,.4);
}
h2{
  margin-top:0;
  color:#38bdf8;
}
.signal{
  font-size:22px;
  font-weight:bold;
  margin-top:10px;
}
.buy{color:#22c55e;}
.sell{color:#ef4444;}
.neutral{color:#f59e0b;}
button{
  width:100%;
  padding:12px;
  border:none;
  border-radius:10px;
  background:#2563eb;
  color:white;
  font-size:16px;
  margin-top:10px;
}
textarea{
  width:100%;
  height:100px;
  border-radius:10px;
  border:none;
  padding:10px;
  font-size:15px;
}
iframe{
  width:100%;
  height:400px;
  border:none;
  border-radius:10px;
}
.nav{
  display:flex;
  justify-content:space-around;
  background:#111827;
  padding:12px;
  position:fixed;
  bottom:0;
  width:100%;
}
.nav a{
  color:white;
  text-decoration:none;
  font-size:14px;
}
.space{height:70px;}
</style>
</head>
<body>

<header>📈 AI Market Analysis</header>

<div class="container">

  <!-- TradingView Chart -->
  <div class="card">
    <h2>Live Forex Chart</h2>
    <iframe src="https://s.tradingview.com/widgetembed/?symbol=FX:EURUSD&interval=15&theme=dark"></iframe>
  </div>

  <!-- Rise/Fall -->
  <div class="card">
    <h2>Rise / Fall</h2>
    <button onclick="riseFall()">Generate Signal</button>
    <div id="rf" class="signal neutral">Waiting...</div>
  </div>

  <!-- Matches/Differs -->
  <div class="card">
    <h2>Matches / Differs</h2>
    <button onclick="matchDiff()">Generate Signal</button>
    <div id="md" class="signal neutral">Waiting...</div>
  </div>

  <!-- Odd/Even -->
  <div class="card">
    <h2>Odd / Even Pattern</h2>
    <button onclick="oddEven()">Generate Signal</button>
    <div id="oe" class="signal neutral">Waiting...</div>
  </div>

  <!-- Under/Over -->
  <div class="card">
    <h2>Under / Over</h2>
    <button onclick="underOver()">Generate Signal</button>
    <div id="uo" class="signal neutral">Waiting...</div>
  </div>

  <!-- Forex Signal -->
  <div class="card">
    <h2>Forex Signal</h2>
    <button onclick="forexSignal()">Analyze Forex</button>
    <div id="fx" class="signal neutral">Waiting...</div>
  </div>

  <!-- AI Analysis -->
  <div class="card">
    <h2>AI Market Analysis</h2>
    <textarea id="marketInput" placeholder="Type market notes, e.g. EURUSD bullish, strong USD news..."></textarea>
    <button onclick="aiAnalyze()">Run AI Analysis</button>
    <div id="aiResult" style="margin-top:10px;">AI waiting...</div>
  </div>

</div>

<div class="space"></div>

<!-- Bottom Navigation -->
<div class="nav">
  <a href="index.html">Home</a>
  <a href="analyse.html">Analyse</a>
  <a href="signals.html">Signals</a>
  <a href="deposit.html">Deposit</a>
  <a href="withdraw.html">Withdraw</a>
</div>

<script>
function randomChoice(arr){
  return arr[Math.floor(Math.random()*arr.length)];
}

function riseFall(){
  let s = randomChoice([
    '<span class="buy">📈 RISE</span>',
    '<span class="sell">📉 FALL</span>'
  ]);
  document.getElementById('rf').innerHTML = s;
}

function matchDiff(){
  let s = randomChoice([
    '<span class="buy">✔ MATCHES</span>',
    '<span class="sell">✖ DIFFERS</span>'
  ]);
  document.getElementById('md').innerHTML = s;
}

function oddEven(){
  let s = randomChoice([
    '<span class="buy">🔢 ODD</span>',
    '<span class="sell">🔢 EVEN</span>'
  ]);
  document.getElementById('oe').innerHTML = s;
}

function underOver(){
  let s = randomChoice([
    '<span class="buy">⬆ OVER</span>',
    '<span class="sell">⬇ UNDER</span>'
  ]);
  document.getElementById('uo').innerHTML = s;
}

function forexSignal(){
  let s = randomChoice([
    '<span class="buy">BUY EUR/USD</span>',
    '<span class="sell">SELL EUR/USD</span>',
    '<span class="buy">BUY GBP/USD</span>',
    '<span class="sell">SELL GBP/USD</span>'
  ]);
  document.getElementById('fx').innerHTML = s;
}

function aiAnalyze(){
  let text = document.getElementById('marketInput').value.toLowerCase();
  let result = '';

  if(text.includes('bull') || text.includes('buy') || text.includes('up')){
    result = '🤖 AI: Market sentiment is BULLISH. Consider BUY opportunities.';
  }else if(text.includes('bear') || text.includes('sell') || text.includes('down')){
    result = '🤖 AI: Market sentiment is BEARISH. Consider SELL opportunities.';
  }else{
    result = '🤖 AI: Market is NEUTRAL. Wait for confirmation.';
  }

  document.getElementById('aiResult').innerHTML = result;
}
</script>

</body>
</html>
