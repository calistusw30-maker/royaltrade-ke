<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AI Market Analysis</title>
<style>
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#0f172a;
  color:white;
}
header{
  background:#111827;
  padding:15px;
  text-align:center;
  font-size:24px;
  font-weight:bold;
}
.container{
  padding:15px;
}
.card{
  background:#1e293b;
  border-radius:15px;
  padding:15px;
  margin-bottom:15px;
  box-shadow:0 0 10px rgba(0,0,0,.4);
}
h2{
  margin-top:0;
  color:#38bdf8;
}
.signal{
  font-size:22px;
  font-weight:bold;
  margin-top:10px;
}
.buy{color:#22c55e;}
.sell{color:#ef4444;}
.neutral{color:#f59e0b;}
button{
  width:100%;
  padding:12px;
  border:none;
  border-radius:10px;
  background:#2563eb;
  color:white;
  font-size:16px;
  margin-top:10px;
}
textarea{
  width:100%;
  height:100px;
  border-radius:10px;
  border:none;
  padding:10px;
  font-size:15px;
}
iframe{
  width:100%;
  height:400px;
  border:none;
  border-radius:10px;
}
.nav{
  display:flex;
  justify-content:space-around;
  background:#111827;
  padding:12px;
  position:fixed;
  bottom:0;
  width:100%;
}
.nav a{
  color:white;
  text-decoration:none;
  font-size:14px;
}
.space{height:70px;}
</style>
</head>
<body>

<header>📈 AI Market Analysis</header>

<div class="container">

  <!-- TradingView Chart -->
  <div class="card">
    <h2>Live Forex Chart</h2>
    <iframe src="https://s.tradingview.com/widgetembed/?symbol=FX:EURUSD&interval=15&theme=dark"></iframe>
  </div>

  <!-- Rise/Fall -->
  <button onclick="signal('risefall')">Generate Signal</button>
<p id="risefall-result">Waiting...</p>

  <!-- Matches/Differs -->
  <button onclick="signal('matches')">Generate Signal</button>
<p id="matches-result">Waiting...</p>
    

  <!-- Odd/Even -->
  <button onclick="signal('odd')">Generate Signal</button>
<p id="odd-result">Waiting...</p>

  <!-- Under/Over -->
<button onclick="signal('under')">Generate Signal</button>
<p id="under-result">Waiting...</p>
  <!-- Forex Signal -->
  <div class="card">
    <h2>Forex Signal</h2>
    <button onclick="forexSignal()">Analyze Forex</button>
    <div id="fx" class="signal neutral">Waiting...</div>
  </div>

  <!-- AI Analysis -->
  <div class="card">
    <h2>AI Market Analysis</h2>
    <textarea id="marketInput" placeholder="Type market notes, e.g. EURUSD bullish, strong USD news..."></textarea>
    <button onclick="aiAnalyze()">Run AI Analysis</button>
    <div id="aiResult" style="margin-top:10px;">AI waiting...</div>
  </div>

</div>

<div class="space"></div>

<!-- Bottom Navigation -->
<div class="nav">
  <a href="index.html">Home</a>
  <a href="analyse.html">Analyse</a>
  <a href="signals.html">Signals</a>
  <a href="deposit.html">Deposit</a>
  <a href="withdraw.html">Withdraw</a>
</div>

<script>
function signal(type){
  let result = "";

  if(type === 'risefall'){
    result = Math.random() > 0.5 ? '📈 BUY RISE' : '📉 BUY FALL';
    document.getElementById('risefall-result').innerHTML = result;
  }

  if(type === 'matches'){
    result = Math.random() > 0.5 ? '🎯 MATCH' : '❌ DIFFER';
    document.getElementById('matches-result').innerHTML = result;
  }

  if(type === 'odd'){
    result = Math.random() > 0.5 ? '🔢 ODD' : '🔢 EVEN';
    document.getElementById('odd-result').innerHTML = result;
  }

  if(type === 'under'){
    result = Math.random() > 0.5 ? '⬇️ UNDER 5' : '⬆️ OVER 5';
    document.getElementById('under-result').innerHTML = result;
  }
}
</script>
</body>
</html>
