<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Analysis</title>

<style>
body{
    margin:0;
    background:#030f2b;
    font-family:Arial, sans-serif;
    color:white;
    padding:15px;
}

.card{
    background:#0d1735;
    border-radius:25px;
    padding:20px;
    margin-bottom:25px;
    box-shadow:0 0 15px rgba(0,0,0,0.3);
}

h2{
    color:#2ea3ff;
    margin-bottom:20px;
    font-size:22px;
}

button{
    width:100%;
    padding:18px;
    border:none;
    border-radius:18px;
    background:#2563eb;
    color:white;
    font-size:22px;
    cursor:pointer;
}

button:hover{
    opacity:0.9;
}

.result{
    font-size:22px;
    font-weight:bold;
    margin-top:18px;
}

.time{
    display:block;
    margin-top:8px;
    color:#9ca3af;
    font-size:14px;
}

.bottom-nav{
    position:fixed;
    bottom:0;
    left:0;
    right:0;
    background:#111827;
    display:flex;
    justify-content:space-around;
    padding:12px 0;
    border-top:1px solid #1f2937;
}

.bottom-nav a{
    color:white;
    text-decoration:none;
    font-size:14px;
}
</style>
</head>

<body>

<div class="card">
    <h2>Rise / Fall</h2>
    <button onclick="riseFall()">Generate Signal</button>
    <div class="result" id="rise">Waiting...</div>
    <span class="time" id="rise-time"></span>
</div>

<div class="card">
    <h2>Matches / Differs</h2>
    <button onclick="matchDiff()">Generate Signal</button>
    <div class="result" id="match">Waiting...</div>
    <span class="time" id="match-time"></span>
</div>

<div class="card">
    <h2>Odd / Even</h2>
    <button onclick="oddEven()">Generate Signal</button>
    <div class="result" id="odd">Waiting...</div>
    <span class="time" id="odd-time"></span>
</div>

<div class="card">
    <h2>Under / Over</h2>
    <button onclick="underOver()">Generate Signal</button>
    <div class="result" id="under">Waiting...</div>
    <span class="time" id="under-time"></span>
</div>

<script>
function nowTime(){
    return new Date().toLocaleTimeString();
}

function riseFall(){
    const r = Math.random() > 0.5 ? '📈 BUY RISE' : '📉 BUY FALL';
    document.getElementById('rise').innerHTML = r;
    document.getElementById('rise-time').innerHTML = 'Time: ' + nowTime();
}

function matchDiff(){
    const r = Math.random() > 0.5 ? '🎯 MATCH' : '❌ DIFFER';
    document.getElementById('match').innerHTML = r;
    document.getElementById('match-time').innerHTML = 'Time: ' + nowTime();
}

function oddEven(){
    const r = Math.random() > 0.5 ? '🔢 ODD' : '🔢 EVEN';
    document.getElementById('odd').innerHTML = r;
    document.getElementById('odd-time').innerHTML = 'Time: ' + nowTime();
}

function underOver(){
    const r = Math.random() > 0.5 ? '⬇️ UNDER 5' : '⬆️ OVER 5';
    document.getElementById('under').innerHTML = r;
    document.getElementById('under-time').innerHTML = 'Time: ' + nowTime();
}
    let countdown = 10;

setInterval(() => {
  countdown--;
  if (countdown <= 0) countdown = 10;
  document.getElementById('countdown').innerHTML =
    'Next signal in: ' + countdown + 's';
}, 1000);
</script>
<div id="countdown" style="color:#fff; font-size:18px; padding:10px 20px; text-align:center;">
Next signal in: 10s
</div>
<h2 style="color:#2f7cff; padding:15px 20px 0;">Live Forex Chart</h2>

<div class="tradingview-widget-container" style="padding:0 15px 20px;">
  <div id="tradingview_chart" style="height:400px;"></div>

  <script src="https://s3.tradingview.com/tv.js"></script>
  <script>
  new TradingView.widget({
    "container_id": "tradingview_chart",
    "width": "100%",
    "height": 400,
    "symbol": "FX:EURUSD",
    "interval": "1",
    "timezone": "Africa/Nairobi",
    "theme": "dark",
    "style": "1",
    "locale": "en",
    "toolbar_bg": "#0a1435",
    "enable_publishing": false,
    "hide_top_toolbar": false,
    "save_image": false
  });
  </script>
</div>

<div class="bottom-nav">
    <a href="index.html">Home</a>
    <a href="analyse.html">Analyse</a>
    <a href="signals.html">Signals</a>
    <a href="deposit.html">Deposit</a>
    <a href="withdraw.html">Withdraw</a>
</div>

</body>
</html>
