<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Analysis</title>
  <style>
    body{
      background:#08122b;
      color:white;
      font-family:Arial,sans-serif;
      padding:20px;
    }
    .card{
      background:#111c36;
      padding:20px;
      border-radius:20px;
      margin-bottom:20px;
    }
    h2{
      color:#2ea3ff;
    }
    button{
      width:100%;
      padding:18px;
      border:none;
      border-radius:15px;
      background:#2563eb;
      color:white;
      font-size:20px;
    }
    p{
      font-size:28px;
      font-weight:bold;
      margin-top:15px;
    }
  </style>
</head>
<body>

  <div class="card">
<p id="rise">Waiting...</p>
<small id="rise-time" style="color:#9ca3af;"></small>
    <button onclick="riseFall()">Generate Signal</button>
  <small id="rise-time" style="color:#9ca3af;"></small>
  </div>

  <div class="card">
    <h2>Matches / Differs</h2>
    <button onclick="matchDiff()">Generate Signal</button>
    <p id="match">Waiting...</p>
  </div>

  <div class="card">
    <h2>Odd / Even</h2>
    <button onclick="oddEven()">Generate Signal</button>
    <p id="odd">Waiting...</p>
  </div>

  <div class="card">
    <h2>Under / Over</h2>
    <button onclick="underOver()">Generate Signal</button>
    <small id="under-time" style="color:#9ca3af;"></small>
  </div>

  <script>
    function riseFall(){
  const r = Math.random() > 0.5 ? '📈 BUY RISE' : '📉 BUY FALL';
  const t = new Date().toLocaleTimeString();

  document.getElementById('rise').innerHTML = r;
  document.getElementById('rise-time').innerHTML = 'Time: ' + t;
}

  document.getElementById('rise').innerHTML = r;
  document.getElementById('rise-time').innerHTML = 'Time: ' + t;
}

    function matchDiff(){
      const r = Math.random() > 0.5 ? '🎯 MATCH' : '❌ DIFFER';
      document.getElementById('match').innerHTML = r;
    }

    function oddEven(){
      const r = Math.random() > 0.5 ? '🔢 ODD' : '🔢 EVEN';
      document.getElementById('odd').innerHTML = r;
    }

    function underOver(){
  const r = Math.random() > 0.5 ? '⬇️ UNDER 5' : '⬆️ OVER 5';
  const t = new Date().toLocaleTimeString();

  document.getElementById('under').innerHTML = r;
  document.getElementById('under-time').innerHTML = 'Time: ' + t;
}
    }
  </script>

</body>
