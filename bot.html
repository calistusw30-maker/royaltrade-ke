<!DOCTYPE html>
<html>
<head>
  <title>Trading Bot</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body style="background:#07132b;color:white;font-family:Arial;padding:20px;">
  <h1>Trading Bot & Chart</h1>

  <iframe
    src="https://s.tradingview.com/widgetembed/?symbol=FX:EURUSD&interval=15&theme=dark"
    width="100%"
    height="500"
    frameborder="0">
  </iframe>

  <div style="background:#0d1b3d;padding:20px;border-radius:16px;margin-top:20px;">
    <h2>Bot Status</h2>
    <p>Strategy: EMA20 / EMA50</p>
    <p>Risk: 2% per trade</p>
    <p style="color:#00ff66;font-weight:bold;">Current Signal: BUY</p>
  </div>
</body>
</html>
