<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Deposit - Calis Star Trading</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: white;
      margin: 0;
      padding: 0;
    }

    .container {
      max-width: 400px;
      margin: 40px auto;
      background: #1e293b;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 0 10px rgba(0,0,0,0.4);
    }

    h1 {
      text-align: center;
      color: #22c55e;
    }

    label {
      display: block;
      margin-top: 15px;
      margin-bottom: 5px;
    }

    input, select {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 8px;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 20px;
      background: #22c55e;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 18px;
      cursor: pointer;
    }

    button:hover {
      background: #16a34a;
    }

    .note {
      margin-top: 20px;
      background: #111827;
      padding: 12px;
      border-radius: 8px;
      font-size: 14px;
      color: #cbd5e1;
    }

    a {
      color: #38bdf8;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Deposit Funds</h1>

    <form>
      <label>Full Name</label>
      <input type="text" placeholder="Enter your name" required />

      <label>Email</label>
      <input type="email" placeholder="Enter your email" required />

      <label>Deposit Amount (USD)</label>
      <input type="number" placeholder="Enter amount" required />

      <label>Payment Method</label>
      <select required>
        <option value="">Select payment method</option>
        <option>M-Pesa</option>
        <option>Airtel Money</option>
        <option>Bank Transfer</option>
        <option>Crypto (USDT)</option>
      </select>

      <button type="submit">Proceed to Deposit</button>
    </form>

    <div class="note">
      <p><strong>M-Pesa Deposit:</strong> Send payment to <b>07XXXXXXXX</b> and contact support after payment.</p>
      <p>Need help? <a href="https://wa.me/254116099150" target="_blank">Chat on WhatsApp</a></p>
    </div>
  </div>

</body>
</html>
